name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /var/www/vbrion-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Build client
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'server/data' \
            --exclude 'client/src' --exclude 'client/public' \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Install deps & reload app
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" bash -se <<REMOTE
          set -euo pipefail
          cd $DEPLOY_PATH
          npm ci --omit=dev --prefix server
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          REMOTE

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSLk "https://$VPS_HOST/api/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "Health check failed"; exit 1
